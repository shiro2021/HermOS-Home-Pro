insmod all_video
insmod gzio
insmod multiboot2
set gfxpayload=1536x1024x32,1920x1080x32,1600x900x32,1366x768x32,1280x800x32,1280x720x32,1024x768x32
set timeout=0
menuentry 'HermOS (Genode on NOVA)' {
 multiboot2 /boot/bender serial serial_fallback intel_hwp_performance
 module2 /boot/hypervisor hypervisor iommu_intel iommu_amd serial
 module2 /boot/image.elf.gz image.elf
}
