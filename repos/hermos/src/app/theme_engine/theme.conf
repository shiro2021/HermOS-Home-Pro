# HermOS theme — cell layout, colors, panel geometry.
# Format: one directive per line, '#' starts a comment.
#   cell <index> <x> <y> <w> <h>   (1920x1080 design units; the desktop scales
#                                  them to the actual screen resolution)
#   active <r> <g> <b>        focused cell border (thick orange)
#   inactive <r> <g> <b>      unfocused cell border (dark slate)
#   glass <r> <g> <b> [a]     cell glass tint + optional alpha (0-255)
#   dock <r> <g> <b>          left dock icon background
#   sidebar <r> <g> <b>       right panel (Agents & Workers) background
#   accent <r> <g> <b>        accent lines / highlights (search bar, panel edge)
#   panel-height <px>         hideable bottom panel height
#   font-size <px>            base UI font size
#
# The six concept windows: top row Y=300 H=300, bottom row Y=620 H=300.
cell 0 150 300 450 300
cell 1 620 300 450 300
cell 2 1090 300 400 300
cell 3 150 620 450 300
cell 4 620 620 450 300
cell 5 1090 620 400 300
active 255 140 40
inactive 40 60 80
glass 13 18 30 220
dock 46 50 56
sidebar 19 29 42
accent 255 137 37
panel-height 150
font-size 12
